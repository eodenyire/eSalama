# Root-level docker-compose for eSalama development environment.
# Delegates to infra/docker-compose.yml.
# Usage: docker compose up --build
#
# Copy .env.example to .env and adjust values before running.

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esalama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esalama_secret}
      POSTGRES_DB: ${POSTGRES_DB:-esalama}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esalama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-esalama}:${POSTGRES_PASSWORD:-esalama_secret}@db:5432/${POSTGRES_DB:-esalama}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "True"
      API_VERSION: v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./admin-portal:/app
      - /app/node_modules

volumes:
  postgres_data:
